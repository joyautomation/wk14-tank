name: ci
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: install nautilus
        run: go install github.com/joyautomation/nautilus/cmd/nautilus@latest
      - name: check control logic
        run: nautilus check .
      - name: acceptance tests
        run: nautilus test .
      - name: build controller binary
        run: nautilus build -o wk14-tank
